<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maruti Farm Admin</title><style>body{margin:0;background:#f5f4ed;color:#1d3025;font:15px system-ui}.wrap{max-width:1100px;margin:40px auto;padding:0 16px}h1{color:#173c2b}.card{background:white;padding:22px;border-radius:16px;box-shadow:0 8px 30px #1232;margin:16px 0}input{padding:12px;border:1px solid #ccd5cc;border-radius:8px;width:min(360px,90%)}button{padding:12px 18px;border:0;border-radius:8px;background:#173c2b;color:white;font-weight:700;cursor:pointer;margin:8px 4px 8px 0}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4e8e1}th{background:#eff3ed}.scroll{overflow:auto}.muted{color:#68766c}.error{color:#b42318}</style></head><body><div class="wrap"><a href="/">← View website</a><h1>Maruti Farm · Admin Panel</h1><div class="card" id="login"><h2>Admin login</h2><p class="muted">Enter the ADMIN_PASSWORD configured privately on your booking server.</p><input id="password" type="password" placeholder="Admin password"><button onclick="loadBookings()">Login</button><p id="msg" class="error"></p></div><div id="dashboard" hidden><div class="card"><h2>Bookings</h2><p class="muted">Confirmed and pending payment records from the booking database.</p><button onclick="loadBookings()">Refresh bookings</button><button onclick="logout()">Log out</button><div class="scroll"><table><thead><tr><th>Booking ID</th><th>Customer</th><th>Phone</th><th>Date</th><th>Days</th><th>Guests</th><th>Total</th><th>Advance</th><th>Balance</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>let secret='';async function loadBookings(){secret=document.getElementById('password').value||secret;try{let r=await fetch('/api/admin/bookings',{headers:{'x-admin-password':secret}});let d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;document.getElementById('rows').innerHTML=d.bookings.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${esc(b.start_date)}</td><td>${b.days}</td><td>${b.guests}</td><td>₹${b.total_amount}</td><td>₹${b.advance_amount}</td><td>₹${b.total_amount-b.advance_amount}</td><td>${esc(b.status)}</td></tr>`).join('')||'<tr><td colspan="10">No bookings yet.</td></tr>'}catch(e){document.getElementById('msg').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logout(){secret='';document.getElementById('password').value='';document.getElementById('dashboard').hidden=true;document.getElementById('login').hidden=false}</script></body></html>
